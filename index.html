<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060807">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="icon-192.png">

<title>Mujaddid Alf E Sani Organization</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-sized column. A scrolling screen, an in-flow bottom tab bar, and bottom sheets for forms and detail.
   Single committed look: black-green ground matching the emblem, gold accent for brand, separate semantic colors for P / L / A. */
:root {
  --bg: #060807;
  --surface: #0e1411;
  --surface2: #151e19;
  --line: #22302a;
  --fg: #eef1ec;
  --muted: #8e9c94;
  --gold: #cba765;
  --gold-ink: #1a1306;
  --emerald: #1f7a4d;
  --p: #46c283;
  --l: #e3ae3f;
  --a: #df5b4e;
  --display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --body: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 500 15px/1.45 var(--body);
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
  overflow: hidden; overscroll-behavior: none;
}
* { box-sizing: border-box; }
button { font-family: inherit; cursor: pointer; }
button, input, select, textarea { -webkit-appearance: none; appearance: none; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
#screen { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 28px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
#tabs { display: flex; border-top: 1px solid var(--line); background: #0a0f0c; padding: 4px 4px 6px; }
.tab { flex: 1; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; font: 700 10.5px var(--body); letter-spacing: .3px; padding: 6px 0; min-height: 50px; }
.tab svg, .ic { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--gold); }

/* header */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-top: 16px; margin-bottom: 14px; }
.title { font: 700 33px/1.04 var(--display); margin: 0; letter-spacing: .2px; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 7px 11px; font: 700 11.5px var(--body); white-space: nowrap; min-height: 32px; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: block; }
.pill.ok i { background: var(--p); } .pill.warn i { background: var(--l); } .pill.err i { background: var(--a); } .pill.busy i { background: var(--gold); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* hero */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 14px 0 8px; position: relative; }
.hero .pill { position: absolute; top: 10px; right: 0; }
.logo { width: min(60vw, 224px); height: auto; display: block; mix-blend-mode: lighten; }
.org { font: 700 31px/1.06 var(--display); letter-spacing: .3px; margin: 8px 0 6px; color: var(--gold); text-wrap: balance; max-width: 15ch; }
.org-sub { font: 700 10.5px var(--body); letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }

/* surfaces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; }
.panel h3, .sec { font: 800 11px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.sec { margin: 20px 2px 8px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; margin-bottom: 12px; }
.stats div { padding: 12px 8px; text-align: center; }
.stats div + div { border-left: 1px solid var(--line); }
.stats b { display: block; font: 700 28px/1 var(--display); color: var(--fg); font-variant-numeric: tabular-nums; }
.stats span { font: 700 10px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row.tap { width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; color: inherit; text-align: left; }
.grow { flex: 1; min-width: 0; }
.nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mut { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); }
.empty b { display: block; color: var(--fg); font: 700 22px var(--display); margin-bottom: 4px; }

/* controls */
.btn { min-height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface2); color: var(--fg); font: 700 14px var(--body); padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.gold { background: var(--gold); color: var(--gold-ink); border-color: transparent; }
.btn.danger { color: var(--a); }
.btn.sm { min-height: 36px; font-size: 13px; padding: 0 13px; border-radius: 11px; }
.btn.block { width: 100%; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .5; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btns .btn { flex: 1 1 120px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field label, .lbl { font: 800 10.5px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
input, select, textarea { background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; color: var(--fg); font: 500 16px var(--body); padding: 11px 12px; min-height: 46px; width: 100%; min-width: 0; }
input::placeholder, textarea::placeholder { color: #5d6b63; }
input[type=date] { color-scheme: dark; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 20px, calc(100% - 15px) 20px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
.inline { display: flex; gap: 8px; align-items: center; }
.inline .btn { flex: none; }
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 3px; gap: 3px; }
.seg button { flex: 1; min-height: 40px; border: 0; border-radius: 10px; background: none; color: var(--muted); font: 700 13px var(--body); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button.on { background: var(--surface2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--gold); }
.seg small { font-weight: 600; opacity: .75; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface2); border-radius: 99px; padding: 6px 10px; font: 700 12px var(--body); color: var(--fg); }
.tag { font: 800 10px var(--body); letter-spacing: .1em; text-transform: uppercase; border-radius: 6px; padding: 3px 6px; background: #2a2210; color: var(--gold); }
.tag.left { background: #2b1512; color: var(--a); }
.tag.ok { background: #0f2619; color: var(--p); }
.fab { position: sticky; bottom: 12px; display: flex; justify-content: flex-end; margin-top: 14px; pointer-events: none; }
.fab .btn { pointer-events: auto; box-shadow: 0 8px 24px rgba(0, 0, 0, .55); min-height: 50px; padding: 0 20px; }

/* avatars and dots */
.av { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(145deg, #1d4a35, #0f2a1f); border: 1px solid #2a4a3a; color: var(--gold); display: grid; place-items: center; font: 800 13px var(--body); flex: none; }
.av.lg { width: 64px; height: 64px; font-size: 21px; }
.dots { display: inline-flex; gap: 4px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
.dot.on, .dot.P { background: var(--p); } .dot.L { background: var(--l); } .dot.A { background: var(--a); }

/* attendance */
.legend { display: flex; gap: 14px; color: var(--muted); font: 700 11.5px var(--body); margin: 2px 2px 10px; }
.legend b { color: var(--fg); }
.pla { display: flex; gap: 6px; flex: none; }
.pla button { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--muted); font: 800 14px var(--body); padding: 0; }
.pla button.on.P { background: var(--p); color: #04150c; border-color: transparent; }
.pla button.on.L { background: var(--l); color: #1c1200; border-color: transparent; }
.pla button.on.A { background: var(--a); color: #1c0603; border-color: transparent; }
.savebar { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 78%, transparent); padding: 14px 0 6px; margin-top: 8px; }
.counts { display: flex; gap: 14px; font: 800 13px var(--body); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.counts span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.counts .P::before { background: var(--p); } .counts .L::before { background: var(--l); } .counts .A::before { background: var(--a); }
.warn-field input { border-color: var(--a); }
.barrow { display: flex; align-items: center; gap: 16px; }

/* login */
#tabs:empty { display: none; }
.err { color: var(--a); font: 700 13px/1.4 var(--body); margin: -4px 2px 12px; }
.center { text-align: center; }
.loginwrap { padding-top: 18px; }
.loginwrap details { margin: 0 0 14px; border-top: 0; padding-top: 0; }
.loginwrap form { margin-top: 10px; }

/* hierarchy */
.grp { display: flex; justify-content: space-between; font: 800 10.5px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); padding: 12px 0 2px; border-top: 1px solid var(--line); }
.grp:first-child { border-top: 0; padding-top: 8px; }
.grp + .row { border-top: 0; }
.av.lead { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(203, 167, 101, .22); }

/* groups, tally, pickers */
.tally h3 { margin-bottom: 10px; text-transform: none; letter-spacing: .02em; font-size: 12px; }
.tr + .tr { margin-top: 12px; }
.tl { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; font-size: 13.5px; }
.tl .nm { flex: 1; } .tl small { color: var(--muted); font-weight: 600; font-size: 11.5px; margin-left: 4px; }
.tl b { font-variant-numeric: tabular-nums; white-space: nowrap; } .tl em { font-style: normal; color: var(--gold); margin-left: 4px; }
.meter { height: 7px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--p); }
.mini { color: var(--muted); font: 700 12px var(--body); margin: 0 2px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.pick { cursor: pointer; } .chip.pick.on { border-color: var(--gold); color: var(--gold); background: #1d1a10; }
.chip small { font-weight: 600; opacity: .7; }
.cb { width: 24px; height: 24px; border-radius: 8px; border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; color: transparent; font-weight: 800; }
.cb.on { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.avs { border-radius: 14px; }
.stat4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }

/* sheets */
#sheets { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
#sheets .scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .66); pointer-events: auto; }
#sheets .card { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 24px 24px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); pointer-events: auto; overscroll-behavior: contain; }
#sheets .card.in { animation: up .24s cubic-bezier(.2, .8, .2, 1); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.grab { width: 38px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 12px; }
.sh { font: 700 28px/1.1 var(--display); margin: 0 0 4px; }
.profile { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
.grid3 div { background: var(--surface2); border-radius: 14px; padding: 10px 4px; text-align: center; }
.grid3 b { display: block; font: 800 20px/1.1 var(--body); font-variant-numeric: tabular-nums; }
.grid3 span { font: 800 9.5px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.kv { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.kv span:first-child { color: var(--muted); }
.kv span:last-child { text-align: right; min-width: 0; overflow-wrap: anywhere; }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; margin: 10px 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 9px 10px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
th { font: 800 10px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--surface2); }
tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { position: sticky; left: 0; text-align: left; background: var(--surface); max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
th:first-child { background: var(--surface2); }
textarea.xbox { min-height: 120px; font: 500 12px/1.4 ui-monospace, Menlo, monospace; }
details { border-top: 1px solid var(--line); padding: 10px 0 0; margin-top: 10px; }
summary { font-weight: 700; color: var(--gold); min-height: 32px; }
ol.steps { margin: 8px 0 4px; padding-left: 20px; color: var(--muted); font-size: 13.5px; }
ol.steps li { margin-bottom: 6px; }
ol.steps b { color: var(--fg); }
#toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #1b2822; border: 1px solid #2f4a3d; color: var(--fg); padding: 11px 16px; border-radius: 14px; font: 700 13px var(--body); z-index: 80; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; text-align: center; }
#toast.show { opacity: 1; }
/* print / PDF: the report is drawn into #printArea, the app is hidden */
#printArea { display: none; }
@media print {
  html, body { height: auto !important; overflow: visible !important; background: #fff !important; color: #111 !important; }
  #app, #sheets, #toast { display: none !important; }
  body.printing #printArea { display: block; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .pr-head { display: flex; align-items: center; gap: 14px; background: #060807; color: #cba765; padding: 10px 14px; border-radius: 8px; }
  .pr-logo { height: 64px; width: auto; display: block; }
  .pr-org { font: 700 17pt var(--display); }
  .pr-title { font: 700 12pt var(--body); color: #fff; margin-top: 2px; }
  .pr-sub { font: 500 8.5pt var(--body); color: #9aa8a0; }
  .pr-h { font: 800 9pt var(--body); letter-spacing: .12em; text-transform: uppercase; color: #1f4a35; margin: 16px 0 6px; break-after: avoid; }
  .pr-t { width: 100%; border-collapse: collapse; font: 500 8.5pt var(--body); color: #111; }
  .pr-t th { background: #0f2a1f !important; color: #cba765 !important; padding: 5px 6px; text-align: left; font-size: 7.5pt; letter-spacing: .06em; text-transform: uppercase; position: static !important; }
  .pr-t td { padding: 4px 6px; border-bottom: 1px solid #d8ddd9; text-align: left; white-space: normal; position: static !important; max-width: none; background: none; }
  .pr-t tr:nth-child(even) td { background: #f4f7f5 !important; }
  .pr-t thead { display: table-header-group; }
  .pr-t tr { break-inside: avoid; }
  .pr-t td.ltr { text-align: center; letter-spacing: .12em; white-space: nowrap; }
  .L-P { color: #1a8f55; } .L-L { color: #b27a00; } .L-A { color: #c1362b; } .L-- { color: #9aa5a0; }
  .pr-foot { margin-top: 14px; font: 500 7.5pt var(--body); color: #6b7a72; }
}
/* master attendance, tag filter, group results */
.tagbar { max-height: 118px; overflow-y: auto; margin-bottom: 12px; padding: 1px; }
.tagbar .chip b { font-weight: 800; color: var(--muted); }
.tagbar .chip.on b { color: inherit; }
.tagbar .chip b.abn { color: var(--a); }
.row.m-P { box-shadow: inset 3px 0 0 var(--p); } .row.m-L { box-shadow: inset 3px 0 0 var(--l); } .row.m-A { box-shadow: inset 3px 0 0 var(--a); background: rgba(223, 91, 78, .06); }
.gh { margin: 2px 2px 10px; } .gh b { display: block; font: 700 25px/1.1 var(--display); color: var(--gold); } .gh span { color: var(--muted); font-size: 12.5px; }
.grid3 .gabs { background: #2b1512; } .grid3 .gabs b { color: var(--a); }
.abscard { background: #1d0f0d; border: 1.5px solid var(--a); border-radius: 18px; padding: 12px 16px 6px; margin-bottom: 12px; }
.abscard h3 { font: 800 11px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--a); margin: 0 0 4px; }
.abscard .row { border-top-color: #3a1c18; }
.tag.late { background: #2a2210; color: var(--l); }
.keptnote { border: 1px solid #2a4a3a; background: #0f2619; color: var(--p); border-radius: 12px; padding: 9px 12px; font: 700 12.5px/1.4 var(--body); margin: 4px 0 10px; }
.fab { gap: 8px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
:root{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
</style>

<body>

<div id="app">
  <main id="screen"></main>
  <nav id="tabs" aria-label="Main"></nav>
</div>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"></div>
<style id="pageStyle"></style>
<div id="printArea" aria-hidden="true"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   CONFIG  -  the one place to change organisation details and behaviour.
   ===================================================================== */
/* Optional settings file (config.js) loaded before this page. Lets one hosted copy be pre-wired for everyone. */
const RC = window.MAO_CONFIG || {};
const CONFIG = {
  appVersion: '4.0.0',
  schema: 4,                                   // bump when stored data shape changes, then add a MIGRATIONS entry
  storageKey: 'mao.attendance.v1',
  org: 'Mujaddid Alf E Sani Organization',
  tagline: 'Attendance & Membership',
  /* Titles in the organisation, HIGHEST FIRST. Order here = order on screen and in exports. Editable later in More. */
  defaultRoles: ['President', 'Vice President', 'Senior Official', 'Secretary', 'Treasurer', 'Coordinator', 'Leader', 'Member'],
  scriptUrl: RC.scriptUrl || '',               // your Web App URL (set in config.js), so the login screen only asks for username and password
  /* Sheet-link mode (no server): staff sign in with Google and the app talks to the Google Sheet directly.
     Put your Google OAuth Client ID and the Sheet link here once, so staff only tap "Continue with Google". */
  googleClientId: RC.googleClientId || '',
  sheetLink: RC.sheetLink || '',
  sheetSessionDays: 14,                        // how long a Google sign-in is remembered on this phone
  sheetFullReadMs: 600000,                     // in Sheet-link mode the whole Sheet is re-read at least this often
  /* Kinds of group. 'key' is stored with the group; 'plural' is shown on screen. Add or rename freely. */
  groupTypes: [{ key: 'Dasta', plural: 'Dastas' }, { key: 'Team', plural: 'Teams' }],
  /* Who may sign in, and what each level may change. Everyone signed in can view. Members and Leaders have NO login.
     The server (Code.gs) holds the same table and is the one that actually enforces it. */
  accessLevels: ['Admin', 'Senior Official', 'President', 'Coordinator'],
  permissions: {
    'Admin':           ['attendance', 'meetings', 'members', 'export', 'users', 'sheet'],
    'Senior Official': ['attendance', 'meetings', 'members', 'export', 'sheet'],
    'President':       ['attendance', 'meetings', 'export'],
    'Coordinator':     ['attendance']
  },
  checkNames: ['Opening', 'Middle', 'Closing'], // three checks per session; rename freely
  lateCountsAsAttended: true,                  // attendance % = (Present + Late) / all marked

const KINDS = ['members', 'meetings', 'groups', 'attendance'];   // every kind of record that syncs
const blank = () => ({
  schema: CONFIG.schema, auth: null, members: {}, meetings: {}, groups: {}, attendance: {},
  dirty: { members: {}, meetings: {}, groups: {}, attendance: {} },
  settings: { mode: 'server', scriptUrl: CONFIG.scriptUrl, sheetLink: CONFIG.sheetLink, sheetId: '', clientId: CONFIG.googleClientId, rev: '', coordinator: '', roles: CONFIG.defaultRoles.slice(), deviceId: uid('d_'), since: 0, lastSync: 0, sheetUrl: '', source: '', cfgUrl: '', cfgSheet: '', cfgClient: '', skew: 0, snapAt: 0 }

function idbOpen() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB is not available'));
    let r; try { r = indexedDB.open(DB_NAME, 1); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => { try { r.result.createObjectStore(DB_STORE); } catch (e) { } };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error || new Error('IndexedDB error')); r.onblocked = () => rej(new Error('IndexedDB blocked'));

}
const idbGet = k => new Promise((res, rej) => { try { const q = idb.transaction(DB_STORE).objectStore(DB_STORE).get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); } catch (e) { rej(e); } });

  while ((d.schema || 0) < CONFIG.schema) { const f = MIGRATIONS[d.schema || 0]; if (f) f(d); d.schema = (d.schema || 0) + 1; }

/* Opens the store and loads everything. If the data cannot be READ, the app refuses to save over it (storeBroken). */
async function initStore() {
  try { idb = await idbOpen(); persistInfo.engine = 'IndexedDB'; } catch (e) { idb = null; persistInfo.engine = 'localStorage'; }
  let raw = null, drafts = null;
  try {
    if (idb) { raw = await idbGet('state'); drafts = await idbGet('drafts'); if (raw == null) { raw = lsGet(LS_KEY); } }   // an older build kept its data in localStorage: take it over
    else { raw = lsGet(LS_KEY); drafts = lsGet(LS_KEY + '.drafts'); }
  } catch (e) { storeBroken = 'This phone would not let the app read its saved data. Nothing is being overwritten. Close the app fully and open it again.'; }
  if (raw) {
    try { S = migrate(JSON.parse(raw)); }
    catch (e) { try { if (idb) await idbPut('corrupt-' + Date.now(), raw); } catch (x) { } S = blank(); }   // keep the unreadable copy aside, never overwrite it
  } else S = blank();
  try { ui.drafts = drafts ? JSON.parse(drafts) : {}; } catch (e) { ui.drafts = {}; }
  skew = Number(S.settings.skew) || 0;
  try { if (navigator.storage && navigator.storage.persist) persistInfo.protected = await navigator.storage.persist(); } catch (e) { }
  if (!storeBroken) {
    await writeState().catch(() => { });
    /* A safety copy at most twice a day, kept apart from the live data, so a bad edit can always be undone. */
    if (idb && raw && now() - (S.settings.snapAt || 0) > 12 * 3600e3 && Object.keys(S.members).length + Object.keys(S.attendance).length) {
      try { await idbPut('snapshot', raw); S.settings.snapAt = now(); S.settings.snapCount = Object.keys(S.attendance).length; await writeState(); } catch (e) { }
    }
  }
}
async function writeState() {

/* One round trip with the Sheet: read what is there, take what is newer, write what this device changed. */
async function sheetPass(manual) {
  const s = S.settings; gQuiet = !manual;
  const readRev = m => sheetStr(m && m[0] && m[0][1]);
  if (!manual && s.rev && !pendingCount() && now() - lastFull < CONFIG.sheetFullReadMs) {
    const [m, a] = await gGet(['_Meta!A1:B1', 'Access!A:E']);      // cheap check: has anyone changed anything?
    if (!accessUser(parseAccess(a))) return null;
    if (readRev(m) && readRev(m) === s.rev) return { v: 3, data: {}, sent: {}, user: me(), sheetUrl: s.sheetUrl, rev: s.rev };
  }
  const ranges = KINDS.map(k => SHEET_TAB[k] + '!A:Z').concat(['Access!A:E', '_Meta!A1:B1']);
  let v;
  try { v = await gGet(ranges); }
  catch (e) { if (e.status === 400 && /parse range|not found/i.test(e.message)) { await ensureTabs(); v = await gGet(ranges); } else throw e; }
  if (!accessUser(parseAccess(v[KINDS.length]))) return null;
  const rev = readRev(v[KINDS.length + 1]), t = now(), canWrite = can('attendance') || can('meetings') || can('members');
  const incoming = {}, sent = {}, writes = [], appends = {}, denied = [];
  let wrote = !rev && canWrite;
  KINDS.forEach((k, i) => {
    const tab = parseTab(k, v[i]), by = {}; incoming[k] = []; sent[k] = {}; appends[k] = [];
    tab.rows.forEach(r => {                                         // if a key is in the Sheet twice, the newer one counts
      const id = sheetStr(r.o[KEY_OF[k]]), u = Number(r.o.updatedAt) || 0, cur = by[id];
      if (!cur) by[id] = { win: r, u, dups: [] };
      else if (u > cur.u) { cur.dups.push(cur.win); cur.win = r; cur.u = u; } else cur.dups.push(r);
    });
    Object.keys(by).forEach(id => {                                 // Sheet -> this device
      const rec = decodeRow(k, by[id].win.o), cur = S[k][id];
      if (!cur || rec.updatedAt > (cur.updatedAt || 0) || (rec.updatedAt === (cur.updatedAt || 0) && !S.dirty[k][id] && canon(k, rec) !== canon(k, cur))) incoming[k].push(rec);
    });
    const missing = SHEET_COLS[k].filter(c => !tab.names.includes(c));
    if (missing.length && canWrite) { writes.push({ range: SHEET_TAB[k] + '!' + colA1(tab.names.length + 1) + '1', values: [missing] }); tab.names = tab.names.concat(missing); wrote = true; }
    const di = tab.names.indexOf('deleted');
    if (canWrite && di >= 0) Object.keys(by).forEach(id => by[id].dups.forEach(d => { if (sheetStr(d.o.deleted).toUpperCase() !== 'TRUE') { writes.push({ range: SHEET_TAB[k] + '!' + colA1(di + 1) + d.n, values: [['TRUE']] }); wrote = true; } }));
    Object.keys(S.dirty[k]).forEach(id => {                         // this device -> Sheet
      const r = S[k][id]; if (!r) return;
      if (!can(KIND_PERM[k])) { if (!denied.includes(k)) denied.push(k); return; }
      const c = sanitizeOut(k, r); sent[k][id] = r.updatedAt; if (!c) return;
      const e = by[id];
      if (e) { if (e.u >= (Number(r.updatedAt) || 0)) return; writes.push({ range: SHEET_TAB[k] + '!A' + e.win.n + ':' + colA1(tab.names.length) + e.win.n, values: [rowCells(k, c, tab.names, e.win.raw, t)] }); wrote = true; }
      else { appends[k].push(rowCells(k, c, tab.names, null, t)); wrote = true; }
    });
  });
  if (writes.length) await gJson('POST', '/values:batchUpdate', { valueInputOption: 'RAW', data: writes });
  for (const k of KINDS) if (appends[k].length) await gAppend(SHEET_TAB[k] + '!A1', appends[k]);
  if (wrote) await gPut('_Meta!A1:B2', [['rev', uid('r')], ['app', CONFIG.appVersion]]);
  lastFull = now();
  return { v: 3, data: incoming, sent, denied, user: me(), sheetUrl: s.sheetUrl, rev: wrote ? '' : rev };   // after our own write, read once more next time so nothing from other phones is missed
}

/* ---- sign in with Google ---- */
async function doSheetLogin() {
  const l = ui.login, s = S.settings; l.err = '';
  const cid = sheetStr(l.cid == null ? s.clientId : l.cid).trim(), link = sheetStr(l.link == null ? s.sheetLink : l.link).trim(), id = parseSheetId(link);
  if (!/^[A-Za-z0-9._-]+\.apps\.googleusercontent\.com$/.test(cid)) { l.err = 'Paste the Google Client ID. It ends in .apps.googleusercontent.com'; return renderLogin(); }
  if (!id) { l.err = 'Paste the Google Sheet link'; return renderLogin(); }
  s.clientId = cid; s.sheetLink = link; s.sheetId = id; s.mode = 'sheet'; persist();
  if (await sourceGuard()) return;
  l.busy = true; gQuiet = false; renderLogin();
  try {
    const tok = await gToken({ pick: true }), info = await gUserInfo(tok);
    const setup = await ensureTabs();
    const list = parseAccess((await gGet(['Access!A:E']))[0]), mine = list.find(x => x.email === info.email);
    let role;
    if (!list.some(x => x.active && x.role === 'Admin')) {          // an empty Sheet: whoever connects it first becomes its Admin
      role = 'Admin';
      const vals = [info.email, info.name, 'Admin', 'TRUE', String(now())];
      if (mine) await gPut('Access!A' + mine.row + ':E' + mine.row, [vals]); else await gAppend('Access!A1', [vals]);
    } else {
      if (!mine || !mine.active || !mine.role) throw new Error(info.email + ' is not on the Access list. Ask an Admin to add this Google email, then try again.');
      role = mine.role;
    }
    S.auth = { token: '', user: { name: (mine && mine.name) || info.name, username: info.email, role }, expires: now() + CONFIG.sheetSessionDays * 864e5 };
    s.sheetUrl = setup.url; s.source = sourceId(); if (!hasData()) s.lastSync = 0; s.rev = '';
    l.busy = false; l.err = ''; ui.tab = 'home'; persist(); render(); sync(false);
  } catch (e) { gTok = ''; S.auth = null; l.busy = false; l.err = e.message || String(e); renderLogin(); }
}
async function sheetPing() { gQuiet = false; const m = await ensureTabs(); S.settings.sheetUrl = m.url; persist(); return m; }

async function sheetUsersApi(action, data) {

  const adminsAfter = ch => { let n = 0, seen = false; list.forEach(x => { let r = x; if (x.email === ch.email) { seen = true; if (ch.deleted) return; r = ch; } if (r.active && r.role === 'Admin') n++; }); if (!seen && !ch.deleted && ch.active && ch.role === 'Admin') n++; return n; };
  if (action === 'users.list') return { ok: true, users: list.slice().sort((a, b) => (a.name || a.email).localeCompare(b.name || b.email)).map(pub) };

    return { ok: true };
  }

    const email = sheetStr(data.username).toLowerCase(), target = list.find(x => x.email === email);
    if (!target) throw new Error('Account not found');
    if (email === me().username) throw new Error('You cannot delete your own account');
    if (adminsAfter({ email, deleted: true }) < 1) throw new Error('There must be at least one active Admin');

    return { ok: true };
  }

}

function parseDelimited(text) {
  const d = text.indexOf('\t') >= 0 ? '\t' : ',', rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {

    else if (ch === '"' && !cell) q = true;
    else if (ch === d) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }

}

  else if (t.dataset.in && INPUTS[t.dataset.in]) INPUTS[t.dataset.in](t.value, t);
});
/* Closing or switching away from the app: write any half-finished marks right now. */
window.addEventListener('pagehide', () => { try { saveDraftsNow(); } catch (e) { } });
document.addEventListener('visibilitychange', () => { if (document.hidden) { try { saveDraftsNow(); } catch (e) { } } });
document.addEventListener('focusin', e => { if (e.target.id === 'xbox') e.target.select(); });
window.addEventListener('online', () => { updatePill(); if (me()) sync(false); });
window.addEventListener('offline', updatePill);
document.addEventListener('visibilitychange', () => { if (!document.hidden && me() && syncReady()) sync(false); });
setInterval(() => { updatePill(); if (!document.hidden && me() && syncReady() && navigator.onLine !== false) sync(false); }, CONFIG.pollMs);

/* ===================== start ===================== */
(async function start() {
  await initStore();
  applyInvite(); applyRuntimeConfig();
  if (S.auth && !S.auth.local && S.auth.expires && S.auth.expires < now()) S.auth.expired = true;   // keep working offline; sign in again only to sync
  persist(); render();
  if (storeBroken) toast(storeBroken);
  if (isSheetMode() && me() && !isLocalUser()) gisLoad().catch(() => { });
  if (me() && syncReady()) sync(false);
})();
})();
